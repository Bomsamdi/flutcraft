name: flutcraft_domain
description: >-
  Pure Dart core of Flutcraft: blocks, items, inventory, crafting, the voxel
  world, physics and actors. Deliberately free of Flutter and Flame so the
  whole simulation can be tested with `dart test`.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  meta: ^1.16.0
  vector_math: ^2.1.4

dev_dependencies:
  # Lint rules only - this package still has no Flutter dependency.
  flutter_lints: ^6.0.0
  test: ^1.25.0
