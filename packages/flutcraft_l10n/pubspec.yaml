name: flutcraft_l10n
description: >-
  Translations for Flutcraft. Owns the ARB files and the mapping from domain
  enums to display names, so that neither the simulation nor the engine ever
  holds a user-facing string.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutcraft_domain:
    path: ../flutcraft_domain
  flutcraft_protocol:
    path: ../flutcraft_protocol
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
