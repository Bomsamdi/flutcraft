name: flutcraft_server
description: >-
  An authoritative Flutcraft server: one world, many players, and nothing on
  the screen. Plain Dart with dart:io — no framework, because the loop is the
  thing worth showing.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  crypto: ^3.0.0
  flutcraft_domain:
    path: ../flutcraft_domain
  flutcraft_protocol:
    path: ../flutcraft_protocol
  vector_math: ^2.1.4

dev_dependencies:
  coverage: ^1.11.0
  flutter_lints: ^6.0.0
  test: ^1.25.0
