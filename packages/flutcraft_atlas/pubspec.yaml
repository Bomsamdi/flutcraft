name: flutcraft_atlas
description: >-
  The procedural texture atlas: every tile painted pixel by pixel in plain
  Dart, plus the UV table that maps a tile and a shade to a rectangle. No
  Flutter and no GPU, so the pixels can be checked byte for byte in a test.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutcraft_domain:
    path: ../flutcraft_domain

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
