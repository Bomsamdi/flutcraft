# Shared analysis configuration for every package in the workspace.
# Individual packages include this file and may only add to it.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    # The workspace root the server image builds from. Its member paths are
    # relative to the build context, where they are correct; from here they
    # point at nothing, and the analyzer says so three times.
    - docker/**
    - "**/generated/**"
