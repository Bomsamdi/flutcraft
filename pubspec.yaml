name: flutcraft_workspace
description: >-
  Monorepo root for Flutcraft — a voxel game built with Flutter and flame_3d,
  developed step by step in a public tutorial series.
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - app/flutcraft
  - packages/flutcraft_atlas
  - packages/flutcraft_domain
  - packages/flutcraft_engine
  - packages/flutcraft_l10n
  - packages/flutcraft_protocol
  - packages/flutcraft_server
  - packages/flutcraft_ui

# Melos 7 requires this to be declared here, in the workspace root.
dev_dependencies:
  melos: ^7.4.0

# Melos is only a task runner here — dependency resolution is done by the pub
# workspace above. Melos 7 reads its configuration from this file.
melos:
  scripts:
    layering:
      description: >-
        Verify architectural boundaries between packages. Lints cannot see across
        package borders, so this is where dependency rules are actually enforced.
      run: dart run tool/check_layering.dart

    english:
      description: >-
        The series is recorded in English, so the source reads in English too.
        Polish belongs in the ARB files and nowhere else.
      run: dart run tool/check_english.dart

    literals:
      description: >-
        No user-facing text written straight into a widget; every string comes
        from an ARB file.
      run: dart run tool/check_no_translatable_literals.dart

    analyze:
      # One command over the whole tree rather than one per package, because
      # the two do not see the same things: a pubspec that points at nothing
      # is invisible from inside a package, and that difference once let two
      # real problems through a green local run and into CI.
      description: Static analysis across the whole tree, warnings are failures.
      run: flutter analyze --fatal-infos --fatal-warnings

    format:
      description: Verify formatting without writing changes.
      run: dart format --output=none --set-exit-if-changed .

    test:
      description: Run every test suite.
      run: flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
