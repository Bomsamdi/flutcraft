name: flutcraft_workspace
description: >-
  Monorepo root for Flutcraft — a voxel game built with Flutter and flame_3d,
  developed step by step in a public tutorial series.
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - app/flutcraft
  - packages/flutcraft_atlas
  - packages/flutcraft_domain
  - packages/flutcraft_engine
  - packages/flutcraft_l10n
  - packages/flutcraft_ui
