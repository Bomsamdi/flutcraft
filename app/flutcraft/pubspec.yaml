name: flutcraft
description: Flutcraft — a voxel game built with Flutter and flame_3d.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies are resolved by the workspace root, not per package.
resolution: workspace

dependencies:
  flame: ^1.38.0
  flutcraft_atlas:
    path: ../../packages/flutcraft_atlas
  flutcraft_domain:
    path: ../../packages/flutcraft_domain
  flutcraft_engine:
    path: ../../packages/flutcraft_engine
  flutcraft_l10n:
    path: ../../packages/flutcraft_l10n
  flutcraft_protocol:
    path: ../../packages/flutcraft_protocol
  flutcraft_ui:
    path: ../../packages/flutcraft_ui
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
